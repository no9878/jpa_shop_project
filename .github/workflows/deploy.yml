name: Deploy to EC2

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  SG_ID: sg-0b5680a239e671136
  IMAGE: ghcr.io/no9878/jpa_shop_project


jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: jpashop
          MYSQL_USER: jpashop
          MYSQL_PASSWORD: jpashop1234
          MYSQL_ROOT_PASSWORD: root1234
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot1234"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean build 

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Open SSH for runner IP
        run: aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ec2-user@${{ secrets.EC2_HOST }} "
            docker pull $IMAGE:${{ github.sha }} &&
            (docker rm -f jpashop || true) &&
            docker run -d --name jpashop --restart unless-stopped \
              --env-file /etc/jpashop.env \
              -e SPRING_PROFILES_ACTIVE=prod -e SERVER_ADDRESS=0.0.0.0 -e JAVA_TOOL_OPTIONS=-Xmx512m \
              -p 127.0.0.1:8080:8080 $IMAGE:${{ github.sha }} &&
            docker image prune -af
          "
      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@${{ secrets.EC2_HOST }} "for i in \$(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && exit 0; sleep 2; done; exit 1"

      - name: Close SSH for runner IP
        if: always() && steps.ip.outputs.ipv4 != ''
        run: aws ec2 revoke-security-group-ingress --group-id $SG_ID --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32