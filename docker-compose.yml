services:
  mysql:
    image: mysql:8.4
    container_name: jpashop-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: jpashop
      MYSQL_USER: jpashop
      MYSQL_PASSWORD: jpashop1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: